apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mqtt-broker-server-cert
  namespace: fita
spec:
  commonName: mqtt-broker
  secretName: mqtt-broker-server-secret
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: intermediate-ca-issuer
  usages:
    - server auth
