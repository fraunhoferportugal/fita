apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fenw-mqtt-client-cert
  namespace: fita
spec:
  commonName: far-edge-node-watcher
  secretName: fenw-mqtt-client-secret
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: intermediate-ca-issuer
  usages:
    - client auth

