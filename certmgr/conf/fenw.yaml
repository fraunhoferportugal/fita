apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fenw-tls
  namespace: fita
spec:
  secretName: fenw-secret
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - fita.fenw
  issuerRef:
    kind: Issuer
    name: intermediate-ca-issuer
