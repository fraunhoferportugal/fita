{{- if .Values.mqttBroker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  labels:
    app: {{ template "fita.fullname" . }}-mqtt-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "fita.fullname" . }}-mqtt-broker
  template:
    metadata:
      labels:
        app: {{ template "fita.fullname" . }}-mqtt-broker
    spec:
      containers:
        - name: broker
          image: {{ .Values.mqttBroker.image.repository }}:{{ coalesce .Values.mqttBroker.image.tag "latest" }}
          imagePullPolicy: {{ .Values.mqttBroker.image.pullPolicy }}
          ports:
            # arguably we could surround this in allowUnsafeNoTLS guards, but i don't think it will make a difference since
            # it is only listening on localhost when the guard is off. it's nice to have the container report that *something* is listening on 1883
            - name: mqtt
              containerPort: {{ .Values.mqttBroker.containerPort }}
            {{- if or (.Values.mqttBroker.tls) (.Values.mqttBroker.mTLS) }}
            - name: mqtt-tls
              containerPort: 8883
            {{- end }}
          resources:
            requests:
              cpu: "250m"
              memory: "250Mi"
            limits:
              cpu: "1"
              memory: "500Mi"
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            {{- if or (.Values.mqttBroker.tls) (.Values.mqttBroker.mTLS) }}
            - name: trust-bundle
              mountPath: /etc/ssl/fita
              readOnly: true
            - name: mqtt-broker-tls
              mountPath: /etc/ssl/broker
              readOnly: true
            {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mosquitto_sub --host localhost --port 1883 --id 'liveness' --topic '$SYS/broker/version' -E -W 2 --qos 0
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mosquitto_sub --host localhost --port 1883 --id 'readiness' --topic '$SYS/broker/version' -E -W 2 --qos 0
      volumes:
        - name: config
          configMap:
            name: mqtt-config
        {{- if or (.Values.mqttBroker.tls) (.Values.mqttBroker.mTLS) }}
        - name: trust-bundle
          configMap:
            name: fita-trust-bundle
        - name: mqtt-broker-tls
          secret:
            secretName: mqtt-broker-server-secret
        {{- end }}
{{- end }}

